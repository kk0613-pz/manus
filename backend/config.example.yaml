deepseek:
  # 在此填入你的 DeepSeek API Key（也可通过环境变量 DEEPSEEK_API_KEY 覆盖）
  api_key: "your-deepseek-api-key"
  base_url: "https://api.deepseek.com"
  # reasoner 模型：DeepSeek 思考/推理模式
  model: "deepseek-reasoner"
  # 推理强度：low / high / max（reasoner 模式下可选）
  reasoning_effort: "high"

tavily:
  # Tavily 搜索 API Key（https://app.tavily.com）
  api_key: "your-tavily-api-key"
  search_depth: "basic"
  max_results: 5
